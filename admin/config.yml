backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # e.g. janedoe/my-art-gallery
  branch: main
  base_url: https://YOUR-OAUTH-WORKER.workers.dev  # set up in Step 3 of README
  auth_endpoint: auth

# When you open /admin on localhost, Decap CMS automatically uses this
# local backend instead of GitHub login — it writes straight to your files
# on disk so you can test uploads before deploying. Safe to leave in for
# production too; it only ever activates on localhost.
local_backend: true

# Images you upload land in this folder and are committed to the repo
media_folder: "images/paintings"
public_folder: "/images/paintings"

collections:
  - name: "paintings"
    label: "Paintings"
    files:
      - file: "data/paintings.json"
        label: "Gallery Wall"
        name: "gallery"
        fields:
          - label: "Paintings"
            name: "paintings"
            widget: "list"
            summary: "{{title}} — No. {{catalogNumber}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Medium", name: "medium", widget: "string", required: false }
              - { label: "Dimensions", name: "dimensions", widget: "string", required: false }
              - { label: "Catalog Number", name: "catalogNumber", widget: "string", hint: "e.g. 004 — used as the plaque number" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text", required: false }
